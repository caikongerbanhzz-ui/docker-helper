name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Universal Autodiscover Patch
        run: |
          # 遍历所有 Dockerfile，清除原有的启动入口
          find . -name "Dockerfile*" | while read -r df; do
            echo "🎯 Patching: $df"
            sed -i '/ENTRYPOINT/d' "$df"
            sed -i '/CMD/d' "$df"
            
            # 注入全自动寻路启动脚本：
            # 1. 自动在容器内寻找真正的 main.py 所在目录
            # 2. 自动寻找 uv 编译出来的虚拟环境可执行文件 (uvicorn)
            # 3. 动态切换到正确目录并离线拉起服务
            cat << 'EOF' >> "$df"

            ENTRYPOINT []
            CMD ["/bin/sh", "-c", "REAL_MAIN_DIR=$(find / -name 'main.py' -not -path '*/.venv/*' -not -path '*/node_modules/*' 2>/dev/null | head -n 1 | xargs dirname); REAL_UVICORN=$(find / -name 'uvicorn' 2>/dev/null | head -n 1); if [ -n \"$REAL_MAIN_DIR\" ] && [ -n \"$REAL_UVICORN\" ]; then echo \"🚀 Found app at: $REAL_MAIN_DIR using $REAL_UVICORN\"; cd \"$REAL_MAIN_DIR\" && \"$REAL_UVICORN\" main:app --host 0.0.0.0 --port 8000; else echo \"❌ Target directory or uvicorn not found!\"; fi"]
          EOF
            
            echo "=== Patched $df ==="
            cat "$df"
          done

      - name: Build A2A Inspector ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
