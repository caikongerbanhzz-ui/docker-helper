name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Robust Python Patch Dockerfile
        run: |
          # 使用 Python 脚本安全地重写 Dockerfile，彻底规避 sed 斜杠报错
          python3 -c "
          import os

          df_path = './Dockerfile'
          if not os.path.exists(df_path):
              print('❌ Dockerfile not found!')
              exit(1)

          with open(df_path, 'r') as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              # 1. 擦除所有包含 uv sync, uv pip, ENTRYPOINT, CMD 的行
              if any(k in line for k in ['uv sync', 'uv pip', 'ENTRYPOINT', 'CMD']):
                  continue
              new_lines.append(line)

          # 2. 在前端/后端多阶段构建中，强行在合适位置注入我们标准的全局 pip 安装
          # 寻找 COPY pyproject.toml 这一行，在它后面直接塞入强行用 pip 在线下载依赖的命令
          for i, line in enumerate(new_lines):
              if 'COPY pyproject.toml' in line:
                  new_lines.insert(i + 1, 'RUN pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir .\n')
                  break

          # 3. 在文件末尾追加绝对安全的全离线通用启动入口
          offline_cmd = (
              '\nEXPOSE 8000\n'
              'ENTRYPOINT []\n'
              'CMD [\"/bin/sh\", \"-c\", \"if [ -d \\\"backend\\\" ]; then uvicorn backend.main:app --host 0.0.0.0 --port 8000; else uvicorn main:app --host 0.0.0.0 --port 8000; fi\"]\n'
          )
          
          with open(df_path, 'w') as f:
              f.writelines(new_lines)
              f.write(offline_cmd)

          print('✅ Dockerfile successfully patched without sed!')
          "
          # 打印出来的 Dockerfile 可以在 Actions 的日志里直接肉眼检查
          echo "=== Patched Dockerfile ==="
          cat ./Dockerfile

      - name: Build A2A Inspector ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
