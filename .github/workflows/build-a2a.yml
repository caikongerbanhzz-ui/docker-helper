name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Hardcore Overwrite Dockerfile
        run: |
          # 1. 既然知道它缺包，我们在有网的编译阶段直接使出降维打击
          # 2. 我们安装 micropipenv 动态解析它 pyproject.toml 里的所有绝对依赖，并融合成一个 requirements.txt
          pip install micropipenv
          micropipenv requirements > all_requirements.txt || echo "fastapi\nuvicorn\npydantic\npython-socketio\npyjwt\nsse-starlette\nasgi-lifespan\nvalidators\njinja2\npytest\nbleach\nrequests\ntyping-extensions" > all_requirements.txt
          
          # 确保 bleach 无论如何都在兜底列表里
          if ! grep -q "bleach" all_requirements.txt; then
            echo "bleach" >> all_requirements.txt
          fi
          
          # 把这个全量依赖表转成单行安装命令，塞进 Dockerfile 末尾
          DEPENDENCIES=$(cat all_requirements.txt | tr '\n' ' ')
          
          cat << EOF >> ./Dockerfile

          # === 强行注入全量离线运行环境 ===
          # 将全量依赖库（包含 bleach 及所有潜在依赖）死死固化到全局
          RUN pip install --no-cache-dir $DEPENDENCIES

          # 设置确切的工作目录到代码所在的 backend
          WORKDIR /app/backend

          # 绝对无网络请求拉起服务
          ENTRYPOINT []
          CMD ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF

          echo "=== 检查包含全量依赖的 Dockerfile ==="
          cat ./Dockerfile

      - name: Build A2A Inspector ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
