name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Inject Offline Sync Flags into Dockerfile
        run: |
          # 既不删 ENTRYPOINT 也不改 CMD 路径，保持官方原汁原味
          # 只做一件事：在构建阶段把网络拉满下完包，在运行阶段把 uv 强制切成纯离线模式
          
          find . -name "Dockerfile*" | while read -r df; do
            echo "🎯 Modifying flags in: $df"
            
            # 让构建阶段的 uv sync 使用 frozen 模式，强制把依赖固化到当前层里
            sed -i 's/uv sync/uv sync --frozen/g' "$df"
            
            # 在最后的 CMD 或 ENTRYPOINT 之前，注入离线环境变量，迫使 uv 停止外网同步
            # uv 工具只要检测到 UV_OFFLINE=1，运行时就会完全变成单机模式，绝对不调 pypi.org
            sed -i '/FROM/a ENV UV_OFFLINE=1' "$df"
            
            echo "=== Patched $df ==="
            cat "$df"
          done

      - name: Build A2A Inspector ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
