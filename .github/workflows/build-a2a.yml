name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-download Dependencies via Host Python
        run: |
          pip install micropipenv
          micropipenv requirements > requirements.txt || echo "fastapi\nuvicorn\npydantic\npython-socketio\npyjwt\na2a-sdk\nsse-starlette\nasgi-lifespan\nvalidators\njinja2\npytest\ntypes-requests\ntyping-extensions" > requirements.txt
          mkdir wheels
          pip download --platform linux_arm64 --only-binary=:all: -d wheels -r requirements.txt || true

      - name: Create Clean Entrypoint Script
        run: |
          # 建立一个绝对不会有引号、转义字符问题的纯文本启动脚本
          cat << 'EOF' > start.sh
          #!/bin/sh
          if [ -d "backend" ]; then
              exec uvicorn backend.main:app --host 0.0.0.0 --port 8000
          else
              exec uvicorn main:app --host 0.0.0.0 --port 8000
          fi
          EOF
          chmod +x start.sh

      - name: Inject Pure Offline Installation into Dockerfile
        run: |
          # 用 Python 只清除坏行，不写入复杂的 CMD 字符串
          python3 -c "
          import os

          df_path = './Dockerfile'
          if not os.path.exists(df_path):
              exit(0)

          with open(df_path, 'r') as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              if any(k in line for k in ['uv sync', 'uv pip', 'pip install', 'ENTRYPOINT', 'CMD', 'COPY pyproject.toml']):
                  continue
              new_lines.append(line)

          # 仅插入离线安装包和复制启动脚本的命令
          offline_inject = (
              '\n'
              'COPY wheels /app/wheels\n'
              'RUN pip install --no-index --find-links=/app/wheels /app/wheels/*.whl || true\n'
              'COPY start.sh /app/start.sh\n'
              'EXPOSE 8000\n'
              'ENTRYPOINT [\"/app/start.sh\"]\n'
          )

          for i, line in enumerate(new_lines):
              if 'WORKDIR' in line:
                  new_lines.insert(i + 1, offline_inject)
                  break

          with open(df_path, 'w') as f:
              f.writelines(new_lines)
          "
          echo "=== Patched Dockerfile ==="
          cat ./Dockerfile

      - name: Build A2A Inspector ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
