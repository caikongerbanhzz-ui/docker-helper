name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch: # 允许手动点击按钮触发执行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A2A Inspector Source Code
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Patch Dockerfile and Scripts for Offline Use
        run: |
          # 核心修复逻辑：
          # 1. 查找官方启动脚本（通常是 entrypoint.sh 或 scripts 目录下的启动文件）
          # 2. 强行在 uv sync 命令后面加上 --offline 或者是把运行时同步直接删掉，改在构建期完成
          
          # 修改 backend/Dockerfile，让它在 build 阶段就把依赖锁死
          # 并在运行期禁用网络同步
          if [ -f "backend/Dockerfile" ]; then
            echo "Patching backend Dockerfile..."
            # 在构建期强行执行一次同步，把所有包下载到镜像里
            sed -i '/COPY . \./i RUN uv sync --frozen' backend/Dockerfile
          fi
          
          # 检查并修改可能的启动脚本
          find . -name "*.sh" -o -name "run*" | xargs sed -i 's/uv sync/uv sync --offline/g' 2>/dev/null || true

      - name: Build A2A Inspector ARM64 Image
        run: |
          # 开始跨架构编译
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
