name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Universal Patch All Dockerfiles
        run: |
          # 自动寻找仓库里的所有 Dockerfile（不论是在根目录还是 backend 目录）
          # 并使用 Python 的特殊模块路径启动，确保能安全加载
          
          find . -name "Dockerfile*" | while read -r df; do
            echo "🎯 Found Dockerfile to patch: $df"
            
            # 1. 彻底清除里面所有的 ENTRYPOINT 和 CMD 指令，防止多阶段构建中任何一处残留联网脚本
            sed -i '/ENTRYPOINT/d' "$df"
            sed -i '/CMD/d' "$df"
            
            # 2. 在文件末尾追加绝对安全的离线启动逻辑
            # 同时兼容直接运行 main:app 和 通过 python -m uvicorn 运行
            cat << 'EOF' >> "$df"

            # 强行重置入口：无网络请求，尝试多路径兼容拉起服务
            ENTRYPOINT []
            CMD ["/bin/sh", "-c", "if [ -d 'backend' ]; then /app/.venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port 8000; else /app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000; fi"]
          EOF
            
            echo "=== Content of patched $df ==="
            cat "$df"
          done

      - name: Build A2A Inspector ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
