name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Kill UV Sync and Use Standard Pip
        run: |
          # 既然官方的 uv sync 自带冲突，那我们直接用暴力手段把 Dockerfile 格式化
          find . -name "Dockerfile*" | while read -r df; do
            echo "✂️ Surgery on: $df"
            
            # 1. 把所有带有 'uv sync' 的行，替换成纯标准的全局 pip 安装，强行忽略不兼容的锁定
            sed -i 's/RUN uv sync.*/RUN pip install --no-cache-dir -r pyproject.toml || pip install --no-cache-dir ./backend || true/g' "$df"
            
            # 2. 把所有 'uv pip install' 替换成正常的 'pip install'
            sed -i 's/uv pip install/pip install/g' "$df"
            
            # 3. 彻底清除所有的 ENTRYPOINT 和 CMD，防止它在运行时又调用遗留的 uv 脚本
            sed -i '/ENTRYPOINT/d' "$df"
            sed -i '/CMD/d' "$df"
            
            # 4. 注入绝对离线、不依赖 uv 虚拟环境的纯净 Python 启动命令
            # 官方项目是基于 FastAPI 的，只要装好了全局依赖，直接在根目录或 backend 目录下用 uvicorn 就能拉起来
            cat << 'EOF' >> "$df"
            EXPOSE 8000
            ENTRYPOINT []
            CMD ["/bin/sh", "-c", "if [ -d 'backend' ]; then uvicorn backend.main:app --host 0.0.0.0 --port 8000; else uvicorn main:app --host 0.0.0.0 --port 8000; fi"]
          EOF
            
            echo "=== Resulting $df ==="
            cat "$df"
          done

      - name: Build A2A Inspector ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
