name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Precise Patch Dockerfile
        run: |
          # 核心修复：
          # 1. 官方在运行阶段通过高级手段把本地环境锁成了只读或未完全同步状态。
          # 2. 我们通过修改环境变量，强行在有网的构建阶段让其下载所有 Python 依赖。
          # 3. 彻底覆盖其最后的启动入口，防止它在内网再次执行在线同步脚本。
          
          # 【步骤1】在前端/后端构建的关键位置注入环境变量，允许它把所有包下载到本地
          if [ -f "backend/Dockerfile" ]; then
            echo "Patching backend/Dockerfile..."
            # 找到官方的 uv sync 或者 python 相关的运行位置，确保 --frozen 编译通过
            sed -i 's/uv sync/uv sync --frozen/g' backend/Dockerfile
          fi
          
          # 【步骤2】如果它根目录下有主 Dockerfile，我们在它最后覆写成绝对纯净的离线入口
          # 废除原有的复杂 Entrypoint，直接用 Python 执行编译好的依赖
          cat << 'EOF' >> Dockerfile

          # 强行重置入口，直接使用构建阶段已经下载好的虚拟环境
          ENTRYPOINT []
          CMD ["/app/.venv/bin/uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF

          # 打印 Dockerfile 方便排查
          echo "=== Tail of Dockerfile ==="
          tail -n 20 Dockerfile

      - name: Build A2A Inspector ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
