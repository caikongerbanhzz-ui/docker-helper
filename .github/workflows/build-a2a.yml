name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Hardcore Overwrite Dockerfile
        run: |
          # 鉴于官方多阶段构建中运行层丢失了大量组件，且核心文件为 app.py
          # 我们不再对原文件修修补补，直接用我们完全可控的、最稳固的基础镜像重写最后几行
          
          # 1. 找到官方 Dockerfile 最后一个阶段开始的地方 (通常是 FROM python:3.12-slim 或者是类似的运行层)
          # 我们直接在 Dockerfile 的最后追加一段“暴力补课”逻辑：强行在运行层把运行所需的核心组件用全局 pip 装好
          cat << 'EOF' >> ./Dockerfile

          # === 强行注入全量离线运行环境 ===
          # 在最后一层强行补齐缺失的 Web 服务器和核心依赖，并把源切回全局
          RUN pip install --no-cache-dir fastapi uvicorn pydantic python-socketio pyjwt sse-starlette asgi-lifespan validators jinja2 pytest

          # 设置确切的工作目录到代码所在的 backend
          WORKDIR /app/backend

          # 抢回指挥权，直接用刚刚装好的全局 uvicorn 离线调起 app.py
          ENTRYPOINT []
          CMD ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF

          echo "=== 检查最终生成的硬核 Dockerfile ==="
          cat ./Dockerfile

      - name: Build A2A Inspector ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
