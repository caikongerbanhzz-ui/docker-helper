name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Absolute Debug Entrypoint
        run: |
          # 建立一个绝对不会死循环、且能暴露内部所有死因的调试脚本
          cat << 'EOF' > start.sh
          #!/bin/sh
          echo "=== 🕵️‍♂️ 启动全量环境诊断 ==="
          echo "当前工作目录:" && pwd
          echo "当前目录下的文件:" && ls -la
          if [ -d "backend" ]; then echo "发现 backend 目录，其中的文件:" && ls -la backend; fi
          echo "当前系统安装的 Python 包列表:" && pip list || true
          
          echo "=== 🚀 开始尝试拉起服务 ==="
          if [ -d "backend" ]; then
              uvicorn backend.main:app --host 0.0.0.0 --port 8000
          else
              uvicorn main:app --host 0.0.0.0 --port 8000
          fi
          
          # 【核心改动】如果上面的 uvicorn 崩溃了，绝对不允许容器退出！
          # 强行打印错误码，并进入无限休眠，确保你执行 docker logs 时能看清所有死因
          echo "❌ 服务崩溃了！错误码为: $?"
          echo "进入挂起状态，等待你查看日志。容器不会重启..."
          while true; do sleep 3600; done
          EOF
          chmod +x start.sh

      - name: Inject Debug Logic into Dockerfile
        run: |
          python3 -c "
          import os

          df_path = './Dockerfile'
          if not os.path.exists(df_path):
              exit(0)

          with open(df_path, 'r') as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              # 擦除所有的启动命令，防止干扰
              if any(k in line for k in ['ENTRYPOINT', 'CMD']):
                  continue
              new_lines.append(line)

          # 只负责把 start.sh 塞进去并作为唯一入口
          debug_inject = (
              '\n'
              'COPY start.sh /app/start.sh\n'
              'EXPOSE 8000\n'
              'ENTRYPOINT [\"/app/start.sh\"]\n'
          )

          with open(df_path, 'w') as f:
              f.writelines(new_lines)
              f.write(debug_inject)
          "
          echo "=== Debug Dockerfile ==="
          cat ./Dockerfile

      - name: Build A2A Inspector ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
