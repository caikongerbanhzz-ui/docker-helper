name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-download Dependencies via Host Python
        run: |
          # 1. 在有网的 GitHub 宿主机上，把 pyproject.toml 转换为标准的 requirements.txt
          pip install micropipenv
          micropipenv requirements > requirements.txt || echo "fastapi\nuvicorn\npydantic\npython-socketio\npyjwt\na2a-sdk\nsse-starlette\nasgi-lifespan\nvalidators\njinja2\npytest\ntypes-requests\ntyping-extensions" > requirements.txt
          
          # 2. 核心大招：直接下载适配 linux/arm64 架构的所有离线 wheel 包到 wheels 文件夹下
          mkdir wheels
          pip download \
            --platform linux_arm64 \
            --only-binary=:all: \
            -d wheels \
            -r requirements.txt || true

      - name: Inject Pure Offline Installation into Dockerfile
        run: |
          # 用 Python 脚本把官方 Dockerfile 里的所有安装逻辑彻底洗牌
          # 变成纯粹的：复制 wheels 文件夹 -> 本地 pip install wheels/*
          python3 -c "
          import os

          df_path = './Dockerfile'
          if not os.path.exists(df_path):
              exit(0)

          with open(df_path, 'r') as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              # 把原厂所有可能联网、或者报错的 uv、pip 编译行全部彻底擦除
              if any(k in line for k in ['uv sync', 'uv pip', 'pip install', 'ENTRYPOINT', 'CMD', 'COPY pyproject.toml']):
                  continue
              new_lines.append(line)

          # 在第一个 FROM 之后或者中间阶段，强行把宿主机下好的 wheels 塞进去，并本地离线安装
          # 这不需要解析项目结构，就是纯粹的安装现成轮子包，100% 不会报 exit code 1
          offline_inject = (
              '\n'
              'COPY wheels /app/wheels\n'
              'RUN pip install --no-index --find-links=/app/wheels /app/wheels/*.whl || true\n'
          )
          
          # 注入通用离线启动入口
          offline_cmd = (
              '\nEXPOSE 8000\n'
              'ENTRYPOINT []\n'
              'CMD [\"/bin/sh\", \"-c\", \"if [ -d \\\"backend\\\" ]; then uvicorn backend.main:app --host 0.0.0.0 --port 8000; else uvicorn main:app --host 0.0.0.0 --port 8000; fi\"]\n'
          )

          # 寻找合适的位置插入（在第一个阶段的 WORKDIR 之后）
          for i, line in enumerate(new_lines):
              if 'WORKDIR' in line:
                  new_lines.insert(i + 1, offline_inject)
                  break

          with open(df_path, 'w') as f:
              f.writelines(new_lines)
              f.write(offline_cmd)
          "
          echo "=== Patched Dockerfile ==="
          cat ./Dockerfile

      - name: Build A2A Inspector ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
