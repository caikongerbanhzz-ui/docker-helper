name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Force Heavy Patch Dockerfile
        run: |
          # 1. 强制在构建阶段(有网环境)把依赖同步全部做完，并生成不可变的生产环境虚拟环境
          # 2. 强行覆写 Dockerfile 的最后一行为完全离线的启动命令，彻底废除官方可能存在的联网 Entrypoint 脚本
          
          cat << 'EOF' >> Dockerfile

          # 以下是我们强行注入的离线固化与启动逻辑
          RUN cd /app && uv sync --frozen
          
          EXPOSE 8000
          WORKDIR /app
          
          # 绕过一切复杂的 entrypoint.sh 脚本，直接用 Python 虚拟环境内的 uvicorn 离线本地拉起服务
          ENTRYPOINT []
          CMD ["/app/.venv/bin/uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF
          
          # 打印一下修改后的 Dockerfile 确保注入成功（可在 Action 日志中查看）
          cat Dockerfile

      - name: Build A2A Inspector ARM64 Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
