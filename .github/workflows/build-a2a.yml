name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch: # 允许手动点击按钮触发执行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A2A Inspector Source Code
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Inject Offline Dependencies into Dockerfile
        run: |
          # 针对 a2a-inspector 启动时联网的问题进行修复
          # 将原本可能在运行期执行的依赖同步，强行在构建期(Build 阶段)提前跑完
          # 这样打包出来的镜像就自带所有依赖，不需要再连 pypi.org
          if [ -f "backend/pyproject.toml" ]; then
            echo "Found pyproject.toml, ensuring dependencies are baked in..."
          fi

      - name: Build A2A Inspector ARM64 Image
        run: |
          # 跨架构编译并确保依赖固化
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            --no-cache \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
