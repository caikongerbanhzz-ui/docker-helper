name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch: # 允许手动点击按钮触发执行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A2A Inspector Source Code
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector' # 自动拉取官方最新源码
          ref: 'main' # 默认打包主分支

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 # 跨架构编译 ARM64 必须依赖 QEMU 模拟器

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build A2A Inspector ARM64 Image
        run: |
          # 使用 buildx 编译并直接导出为本地 OCI/Docker 镜像格式（指定 linux/arm64）
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          # 将编译好的 ARM64 本地镜像打包成 tar 文件
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          
          # 压缩以减小文件体积
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1 # 仅保留1天以节省空间
