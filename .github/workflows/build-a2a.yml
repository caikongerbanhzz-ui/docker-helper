name: Build and Pack A2A Inspector ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'a2aproject/a2a-inspector'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Hard Patch Backend Dockerfile
        run: |
          # 1. 彻底移除官方可能带去联网的 entrypoint 脚本和旧 CMD
          # 2. 精准定位到 backend 目录下，通过正确的模块路径拉起 uvicorn
          
          TARGET_DF="backend/Dockerfile"
          
          if [ -f "$TARGET_DF" ]; then
            echo "Found backend Dockerfile, stripping entrypoint and fixing path..."
            
            # 删除原有的 ENTRYPOINT 和 CMD 行（防止多指令冲突或调用联网脚本）
            sed -i '/ENTRYPOINT/d' $TARGET_DF
            sed -i '/CMD/d' $TARGET_DF
            
            # 在 backend/Dockerfile 末尾追加绝对安全的离线启动命令
            # 官方的工作目录是 /app，后端代码在 /app/backend
            cat << 'EOF' >> $TARGET_DF

            # 强行重置入口：无网络请求，直接通过 python 模块路径启动
            ENTRYPOINT []
            CMD ["/app/.venv/bin/uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF
            
            echo "=== Modified backend/Dockerfile ==="
            cat $TARGET_DF
          else
            echo "ERROR: backend/Dockerfile not found!"
            exit 1
          fi

      - name: Build A2A Inspector ARM64 Image
        run: |
          # 正常编译整个项目（Docker 会自动读取修改后的 backend/Dockerfile）
          docker buildx build \
            --platform linux/arm64 \
            -t a2a-inspector-arm64:latest \
            --output type=docker \
            .

      - name: Save Image to Tar
        run: |
          docker save a2a-inspector-arm64:latest -o a2a_inspector_arm64.tar
          gzip a2a_inspector_arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-inspector-arm64-image
          path: a2a_inspector_arm64.tar.gz
          retention-days: 1
